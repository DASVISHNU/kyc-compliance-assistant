[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "vishnudinesh128@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "numpy>=2.5.4",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"
link-mode = "copy"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
